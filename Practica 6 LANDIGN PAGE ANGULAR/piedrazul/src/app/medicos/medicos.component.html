<div class="container-fluid" id="seccion2">
    <h1 class="title">Médicos</h1>
    <div class="row">
      <!-- Barra lateral (Especialidades) -->
      <aside class="col-12 col-sm-2 col-md-4 mb-3">
          <h2>Especialidades</h2>
          <div class="list-group">
              <button type="button" class="list-group-item list-group-item-action"
                  *ngFor="let especialidad of especialidades"
                  [class.active]="especialidad.id == especialidadSeleccionada.id"
                  (click)="seleccionarEspecialidad(especialidad)">
                  {{especialidad.nombre}}
              </button>
          </div>
      </aside>
      <!-- Sección de médicos -->
      <main class="col-12 col-sm-10 col-md-8">
        <!-- Descripción de la especialidad seleccionada -->
        <div class="mb-4">
            <h3>{{especialidadSeleccionada.nombre}}</h3>
            <p>{{especialidadSeleccionada.descripcion}}</p>
        </div>

        <!-- Cartas de los médicos -->
        <div class="row g-3">
            <div class="col-12 col-sm-6 col-md-4 col-lg-3" *ngFor="let medico of medicos">
                <div class="card h-100 border border-primary">
                    <img src="{{medico.imagen}}" class="card-img-top img-fluid" alt="Foto de {{medico.nombre}}">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">{{medico.nombre}}</h5>
                        <p class="card-text"><strong>{{medico.especialidad}}:</strong> {{medico.enfoque}}</p>
                        <p class="card-text fst-italic">"{{medico.frase}}"</p>
                        <a href="#seccion3" class="btn btn-primary mt-auto"><i class="fas fa-calendar-check"></i> Agendar cita</a>
                    </div>
                </div>
            </div>
        </div>
      </main>
    </div>
</div>
